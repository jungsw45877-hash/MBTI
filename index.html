<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>나를 알아봄 - MBTI 스타일 성격 테스트</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- 시작 화면 -->
        <section id="start-screen" class="screen active">
            <div class="logo">🔍</div>

            <h1>나를 알아봄</h1>

            <p class="subtitle">
                재미있는 질문으로 알아보는<br>
                나의 성격 유형 테스트
            </p>

            <div class="info">
                <span>🎯 10개의 질문</span>
                <span>⏱ 약 3분</span>
                <span>✨ 4가지 유형</span>
            </div>

            <button id="start-btn" class="main-btn">
                🚀 테스트 시작하기
            </button>
        </section>


        <!-- 질문 화면 -->
        <section id="quiz-screen" class="screen">

            <div class="quiz-header">
                <span id="question-number">1 / 10</span>
                <span id="question-type">O / X</span>
            </div>

            <div class="progress">
                <div id="progress-bar"></div>
            </div>

            <div class="question-card">

                <div id="question-emoji" class="question-emoji">
                    💭
                </div>

                <h2 id="question-text">
                    질문이 들어갑니다.
                </h2>

                <div id="answer-buttons" class="answer-buttons">
                    <!-- JavaScript로 버튼 생성 -->
                </div>

            </div>

        </section>


        <!-- 결과 분석 화면 -->
        <section id="loading-screen" class="screen">

            <div class="loading-icon">🔍</div>

            <h2>당신의 성격을<br>분석하고 있어요...</h2>

            <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <p>잠시만 기다려주세요!</p>

        </section>


        <!-- 결과 화면 -->
        <section id="result-screen" class="screen">

            <div class="result-top">
                <span>🎉 테스트 완료!</span>
            </div>

            <div id="result-emoji" class="result-emoji">
                🎨
            </div>

            <p class="result-label">당신의 성격 유형은</p>

            <h1 id="result-title">
                창의적인 아이디어맨
            </h1>

            <p id="result-description" class="result-description">
                새로운 것을 생각하고 시도하는 것을 좋아하는 사람!
            </p>

            <div id="result-keywords" class="keywords">
                <!-- JavaScript로 생성 -->
            </div>

            <div class="result-box">

                <h3>💡 나의 특징</h3>

                <ul id="result-features">
                    <!-- JavaScript로 생성 -->
                </ul>

            </div>

            <div class="result-actions">

                <button id="share-btn" class="main-btn">
                    📤 결과 공유하기
                </button>

                <button id="restart-btn" class="secondary-btn">
                    🔄 다시 테스트하기
                </button>

            </div>

        </section>

    </main>

    <footer>
        <p>🔍 나를 알아봄 · MBTI 스타일 성격 테스트</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
